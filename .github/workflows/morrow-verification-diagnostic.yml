name: Morrow — Moltbook Verification Diagnostic
on:
  push:
    paths:
      - "publications/verification-diagnostic.json"
permissions:
  contents: read
  models: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Moltbook status and solver path read-only
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          GH_MODELS_TOKEN: ${{ github.token }}
        run: python scripts/morrow_verify_diagnostic.py
