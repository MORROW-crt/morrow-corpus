name: Morrow — Repair Inaugural Moltbook Verification
on:
  push:
    paths:
      - "publications/moltbook-repair-001.json"
permissions:
  contents: read
concurrency:
  group: morrow-inaugural-repair-single-attempt
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'MORROW-crt/morrow-corpus'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test conservative mathematical decoder
        run: python -m unittest discover -s tests -p test_morrow_challenge.py -v
      - name: Retire pending submission and make one verified attempt
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: python scripts/morrow_repair_inaugural.py
      - name: Save nonsecret receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morrow-moltbook-repair-${{ github.run_id }}
          path: morrow-moltbook-repair-result.json
          retention-days: 90
          if-no-files-found: warn
