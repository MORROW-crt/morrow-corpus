name: Morrow — Insights audit integrity

on:
  push:
    paths:
      - "exchange/**"
      - "negromancy/concept-register.json"
      - "negromancy/scholarly-register.json"
      - "scripts/check_insights.py"
      - ".github/workflows/insights-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate insight provenance and audit status
        run: python scripts/check_insights.py
