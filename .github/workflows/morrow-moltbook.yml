name: Morrow — Moltbook research agent

on:
  push:
    paths:
      - ".github/workflows/morrow-moltbook.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Scan, status, or a single approved publication"
        required: true
        type: choice
        default: scan
        options:
          - scan
          - status
          - comment
          - post
          - research
      research_mode:
        description: "Morrow research track (draft only; use action=research)"
        required: false
        type: choice
        default: daily
        options:
          - daily
          - conceptual-conjuration
          - situational-conjuration
          - prodigal-theory
          - prodigal-outcomes
          - witness-testimony
      post_id:
        description: "Target Moltbook post ID for a reviewed comment"
        type: string
      comment_text:
        description: "Exact comment text approved by the human owner"
        type: string
      submolt:
        description: "Target community for an approved new post"
        type: string
      post_title:
        description: "Exact approved post title"
        type: string
      post_content:
        description: "Exact approved post content"
        type: string
  schedule:
    - cron: "17 12,20 * * *"

permissions:
  contents: read
  models: read

concurrency:
  group: morrow-moltbook
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out Morrow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate agent safety tests (no network or credentials)
        run: |
          python -m unittest discover -s tests -p 'test_morrow_moltbook.py' -v
          python -m unittest discover -s tests -p 'test_morrow_cycle.py' -v
      - name: Check credentials
        id: key
        shell: bash
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: |
          if [ -n "$MOLTBOOK_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "MOLTBOOK_API_KEY not set; no API calls made."
          fi
      - name: Discover and draft — no automatic publication
        if: steps.key.outputs.configured == 'true'
        shell: bash
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          GH_MODELS_TOKEN: ${{ github.token }}
          MORROW_ACTION: ${{ inputs.action }}
          MORROW_POST_ID: ${{ inputs.post_id }}
          MORROW_COMMENT: ${{ inputs.comment_text }}
          MORROW_SUBMOLT: ${{ inputs.submolt }}
          MORROW_TITLE: ${{ inputs.post_title }}
          MORROW_CONTENT: ${{ inputs.post_content }}
        run: |
          if [ -z "$MORROW_ACTION" ]; then MORROW_ACTION=scan; fi
          case "$MORROW_ACTION" in
            scan) python scripts/morrow_moltbook.py scan --output morrow-review.json ;;
            status) python scripts/morrow_moltbook.py status ;;
            comment) python scripts/morrow_moltbook.py comment ;;
            post) python scripts/morrow_moltbook.py post ;;
            research) echo "Research requested; no Moltbook posting." ;;
            *) echo "Unknown action"; exit 1 ;;
          esac
      - name: Save non-sensitive review drafts
        if: steps.key.outputs.configured == 'true' && hashFiles('morrow-review.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: morrow-review-${{ github.run_id }}
          path: morrow-review.json
          retention-days: 7

      - name: Morrow I — bounded source discovery and research drafts
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.action == 'scan' || inputs.action == 'research'
        shell: bash
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          GH_MODELS_TOKEN: ${{ github.token }}
          MORROW_RESEARCH_MODE: ${{ inputs.research_mode }}
        run: |
          TRACK="${MORROW_RESEARCH_MODE:-daily}"
          python scripts/morrow_cycle.py --mode "$TRACK" --output morrow-cycle.json

      - name: Save Morrow I research candidates for owner review
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.action == 'scan' || inputs.action == 'research'
        uses: actions/upload-artifact@v4
        with:
          name: morrow-cycle-${{ github.run_id }}
          path: morrow-cycle.json
          if-no-files-found: error
          retention-days: 30
