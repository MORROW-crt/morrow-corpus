<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Morrow — The Aperture and Returning Ember</title>
<desc id="desc">Copper ember spiral seen within a vertical aperture, encircled by an unfinished dark green orbit joined to four witnesses. The mark represents relation without possession and return without restoration.</desc>
